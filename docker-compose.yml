# =============================================================================
# WOOWTECH / Woow_podman_litellm  -  Compose deployment path
# =============================================================================
# LiteLLM gateway + PostgreSQL, deployed with podman-compose (or `podman
# compose`, or Portainer's stack deployer against the Podman socket).
#
# This is deployment path (a) of two. Path (b) is the Quadlet/systemd path in
# ./quadlet/. Use THIS file for local development, for Portainer-managed hosts,
# and for parity with the sibling WOOWTECH/Woow_podman_* repositories. Use the
# Quadlet path for an always-on rootless production host where you want systemd
# supervision, journald integration and boot persistence.
#
# Source of truth for behaviour: the k3s manifests in
# WOOWTECH/Woow_litellm_docker_compose (k8s/*.yaml). Every deliberate deviation
# from those manifests is commented below with the word DIFFERENCE.
#
# NOTHING IN THIS FILE HAS BEEN LIVE-TESTED. Every claim below is derived from
# published Podman / LiteLLM / PostgreSQL documentation and from reading the
# LiteLLM source at the pinned tag. Treat it as documented behaviour, not as
# verified behaviour, and run `podman-compose config` before your first `up`.
#
# Prerequisites (see README.md):
#   - Podman >= 4.6      (`podman wait --condition=healthy` backs depends_on)
#   - podman-compose >= 1.3, or Docker Compose v2 invoked via `podman compose`
#   - cgroups v2 (required for the mem_limit / cpus keys to be enforced)
#
# NOTE ON PROJECT NAME: the k3s stack isolates everything in the `litellm`
# Namespace. The Compose analogue is the project name, which prefixes the
# generated network and volume. This file deliberately does NOT set a top-level
# `name:` key, because Portainer derives the project name from the stack name
# and an explicit `name:` can conflict with it. If you are running from the CLI
# and want k3s-like naming, export COMPOSE_PROJECT_NAME=litellm before `up`.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16  -  persistence for virtual keys, budgets, spend logs and the
  # encrypted provider credentials that LITELLM_SALT_KEY protects.
  #
  # k3s analogue: k8s/02-postgres.yaml (headless Service + StatefulSet, 1 replica).
  # The StatefulSet's ordinal naming, ordered rolling update and
  # volumeClaimTemplates carry no information at replicas: 1, so they simply
  # disappear in translation.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine

    # container_name is what aardvark-dns registers on the user-defined bridge
    # network, so this value IS the hostname other containers dial. It is set to
    # `litellm-postgres` to match the k3s headless Service name, which means the
    # SAME DATABASE_URL string works unmodified on k3s, on this compose stack and
    # on the Quadlet units.
    # DIFFERENCE from the k3s repo's own docker-compose.yml, which used the
    # service name `postgres` in DATABASE_URL and therefore was NOT portable.
    container_name: litellm-postgres

    # k3s Pod restartPolicy defaults to Always. `unless-stopped` is the closest
    # Compose/Podman equivalent. Note it restarts immediately with no backoff -
    # there is no CrashLoopBackOff analogue; see README Troubleshooting.
    restart: unless-stopped

    networks:
      litellm-network:
        aliases:
          # Belt and braces: different podman-compose versions register the
          # SERVICE name, the container_name, or both. Declaring both aliases
          # explicitly means `litellm-postgres` and `postgres` always resolve.
          - litellm-postgres
          - postgres

    # DIFFERENCE from the k3s repo's docker-compose.yml: no `ports:` mapping.
    # The k3s Service for postgres is headless/ClusterIP and is unreachable from
    # outside the cluster. `expose` documents the port for humans and for
    # Portainer's UI without publishing it on any host interface. Never add a
    # `ports:` entry for 5432 - it would put the database on your LAN.
    expose:
      - "5432"

    # POSTGRES_USER / POSTGRES_DB have safe non-secret defaults that match k3s.
    # POSTGRES_PASSWORD has NO safe default and uses the ${VAR:?message} form so
    # that `podman-compose up` aborts with a readable error instead of silently
    # deploying a database with a publicly-known password.
    # DIFFERENCE from the k3s repo's docker-compose.yml, which hardcoded
    # POSTGRES_PASSWORD: litellm.
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-litellm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and set a strong value (openssl rand -hex 24)}"
      POSTGRES_DB: "${POSTGRES_DB:-litellm}"
      # Point PGDATA at a SUBDIRECTORY of the mount, exactly as k3s does.
      # On k3s the reason is that an ext4-backed PV root contains lost+found and
      # the postgres entrypoint refuses to initdb into a non-empty directory.
      # A Podman NAMED volume starts genuinely empty so the subdir is not
      # strictly required here - it is kept for byte-level layout parity with
      # k3s, and because it is mandatory if anyone later swaps the named volume
      # for a bind mount onto a dedicated filesystem.
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      # A NAMED VOLUME, NOT a relative bind mount such as ./data/postgres.
      # Under ROOTLESS Podman the postgres image's internal UID 70 is mapped
      # through a user namespace to a high subuid on the host. A host directory
      # created by your login user therefore appears as owned by `nobody` inside
      # the container, and the postgres entrypoint aborts with a data-directory
      # ownership error. Podman initialises a named volume with the image's
      # declared ownership and sidesteps the problem entirely.
      # If you truly need a bind mount, you must additionally run
      #   podman unshare chown -R 70:70 ./data/postgres
      # or use the `:U` mount option. Do not do this without reading the README.
      #
      # NOTE: this volume has NO size limit. The k3s PVC declared 5Gi; a Podman
      # named volume is an unbounded directory that grows until the underlying
      # filesystem fills, and a full disk corrupts PostgreSQL. Monitor free space.
      - pgdata:/var/lib/postgresql/data

    # Single healthcheck. k3s has BOTH a readinessProbe and a livenessProbe
    # running the same pg_isready command with different timings; a container
    # has only one regular healthcheck, so the two collapse. The READINESS
    # timings are the ones kept (10s/5s/10s), because `depends_on:
    # condition: service_healthy` on the litellm service is what gates on this.
    #
    # IMPORTANT - why ${POSTGRES_USER} and not $POSTGRES_USER here:
    # Compose interpolates ${...} on the HOST at parse time, reading .env, so
    # this line is baked into the container config as a literal
    # `pg_isready -U litellm -d litellm`. A single unescaped `$` would be eaten
    # by Compose's own interpolation and the variable would never reach the
    # container's shell at all (you would need `$$` for that). Host-side
    # interpolation is the correct and safer form.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # k3s resource *requests* (100m / 256Mi) are scheduling hints for the kube
    # scheduler and have no meaning on a single host, so they are dropped.
    # Only the *limits* translate. The v2-style top-level keys are used rather
    # than `deploy.resources`, because podman-compose's handling of the v3
    # `deploy:` block is version-dependent.
    # ROOTLESS CAVEAT: these are only enforced if cgroups v2 is in use AND the
    # cpu/cpuset controllers are delegated to your user slice. Verify with
    # `podman stats`; see README Troubleshooting for the delegate.conf drop-in.
    mem_limit: 1g
    cpus: 1.0

    # Labels are purely informational in Podman - nothing selects on them, since
    # there is no Service/selector concept. They exist so you can run
    # `podman ps --filter label=app=litellm-postgres`.
    labels:
      app: "litellm-postgres"
      app.kubernetes.io/name: "litellm"
      app.kubernetes.io/part-of: "woow-litellm"

  # ---------------------------------------------------------------------------
  # LiteLLM proxy  -  the OpenAI-compatible gateway. All models route through
  # OpenRouter; see config/config.yaml.
  #
  # k3s analogue: k8s/04-litellm-deployment.yaml (Deployment + ClusterIP Service).
  # ---------------------------------------------------------------------------
  litellm:
    # Pinned to the exact tag the k3s stack runs. Do not float this to :latest.
    # Ideally pin by digest as well - see README "Updating" for the
    # `podman image inspect --format '{{index .RepoDigests 0}}'` procedure.
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    container_name: litellm
    restart: unless-stopped

    networks:
      - litellm-network

    # DIFFERENCE from k3s, which used a ClusterIP Service reachable only inside
    # the cluster, with external access supplied solely by a Cloudflare tunnel.
    # This stack ships NO cloudflared container (see the warning at the bottom of
    # this file), so the port must be published for the gateway to be usable.
    #
    # SECURITY: this publishes on ALL host interfaces, which puts the LiteLLM
    # Admin UI and the /v1 API on your LAN. That is required for Portainer and
    # remote use, but if this host is on an untrusted network, change the mapping
    # to loopback-only and put a reverse proxy in front:
    #     - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    # Rootless publishing of port 4000 needs no extra privilege; only ports
    # below 1024 require tuning net.ipv4.ip_unprivileged_port_start.
    ports:
      - "${LITELLM_PORT:-4000}:4000"

    volumes:
      # ONE copy of config.yaml, bind-mounted read-only. This is a genuine
      # simplification over k3s, where k8s/03-litellm-config.yaml embeds a
      # byte-for-byte duplicate of config/config.yaml inside a ConfigMap and the
      # two must be kept in sync by hand. Here there is nothing to drift.
      #
      # The `:ro,Z` suffix:
      #   ro = read-only, matching the k3s volumeMount readOnly: true.
      #   Z  = tell Podman to relabel this host path with a PRIVATE SELinux
      #        category so the container may read it. This is REQUIRED on
      #        SELinux-enforcing distributions (Fedora, RHEL, CentOS Stream,
      #        Rocky, Alma) and is a harmless no-op on Debian/Ubuntu/Arch where
      #        SELinux is not enforcing.
      # CAUTION: `Z` is a PRIVATE label. If you also run the Quadlet path
      # against this same file on the same host, the second consumer will be
      # denied access. In that case use the SHARED label `:ro,z` (lowercase) in
      # both places instead.
      - ./config/config.yaml:/app/config.yaml:ro,Z

    # In Compose, `command:` overrides the image's CMD and leaves its ENTRYPOINT
    # intact - exactly matching the k8s `args:` field. The image ENTRYPOINT is
    # docker/prod_entrypoint.sh, which ends in `exec litellm "$@"`, so these
    # arguments are forwarded verbatim to the litellm CLI.
    # Do NOT set `entrypoint:` and do NOT prefix this list with the word
    # `litellm` - that would be passed through as a stray positional argument.
    # The in-container path is /app/config.yaml on BOTH Podman paths; the Quadlet
    # unit mounts its own installed copy (~/.config/litellm/config.yaml) to that
    # same target. Only k3s differs: its ConfigMap mounts at /etc/litellm.
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"

    # NOTE: deliberately NO `env_file:`. This is the analogue of k3s
    # `envFrom.secretRef`, but it is not needed here and is actively harmful.
    # Compose auto-loads ./.env for ${VAR} interpolation whenever that file
    # exists (the CLI Quick Start's `cp .env.example .env` step), and every
    # variable this container needs is declared explicitly in `environment:`
    # below - which takes precedence over env_file anyway. An explicit
    # `env_file: .env` would instead HARD-FAIL Portainer repository deploys:
    # Portainer clones this repo (which ships no .env, only .env.example) and
    # passes the stack variables via `--env-file stack.env`, so both Compose
    # and podman-compose abort at parse time with "env file .../.env not
    # found". Omitting it also keeps POSTGRES_PASSWORD out of the proxy
    # container. The mapping form `{path: .env, required: false}` would work
    # on current tooling, but needs podman-compose >= 1.1 / Compose >= v2.24,
    # so plain omission is the portable choice.

    environment:
      # --- secrets: no safe defaults, so hard-fail instead of half-deploying ---
      # config/config.yaml reads these indirectly as os.environ/... so no secret
      # ever appears in the config file, on k3s or here.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required - copy .env.example to .env and paste your OpenRouter key (sk-or-...)}"
      # (The literal generation command is in .env.example - it is not repeated
      # inside this error message because a bare dollar sign in a compose file is
      # consumed by Compose's own interpolation.)
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required - it is the admin credential AND the Admin UI password; see .env.example for the openssl command that generates one}"
      # LITELLM_SALT_KEY encrypts every provider credential written into
      # Postgres. SET IT ONCE AND NEVER ROTATE IT. If it is left unset LiteLLM
      # silently falls back to using LITELLM_MASTER_KEY as the encryption key,
      # which means a later master-key change would corrupt every stored
      # credential. Setting it explicitly from the very first boot is the only
      # safe configuration. See .env.example and README Security Notes.
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:?LITELLM_SALT_KEY is required - set it ONCE, back it up somewhere durable, and NEVER rotate it; see .env.example for the openssl command that generates one}"
      # Host part must be litellm-postgres (the container_name / network alias
      # above), which keeps this string identical to the k3s Secret's value.
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required - e.g. postgresql://litellm:YOUR_PASSWORD@litellm-postgres:5432/litellm}"

      # --- behaviour flags, carried over from the k3s Deployment ---------------
      # Persist models added from the Admin UI into Postgres. Quoted so YAML does
      # not coerce it to a lowercase boolean. Also set redundantly as
      # general_settings.store_model_in_db in config/config.yaml, same as k3s.
      STORE_MODEL_IN_DB: "${STORE_MODEL_IN_DB:-True}"
      # Disables LiteLLM's load_dotenv(), so credentials come only from the
      # container environment. That is its entire documented effect.
      LITELLM_MODE: "${LITELLM_MODE:-PRODUCTION}"
      # Matches k3s. Note LiteLLM's off-by-one naming: INFO here is what the CLI
      # calls --debug. Set ERROR for the quietest documented production baseline,
      # or DEBUG when troubleshooting.
      LITELLM_LOG: "${LITELLM_LOG:-INFO}"

      # --- DISABLE_SCHEMA_UPDATE: THE ONE FLAG YOU MUST NOT COPY FROM k3s ------
      # DIFFERENCE from k8s/04-litellm-deployment.yaml, which sets this to "true".
      #
      # Why k3s sets it true: on k3s the Prisma schema ALREADY EXISTS in the
      # production database, and multiple restarting/rolling proxy pods must not
      # race each other running migrations. Upstream's own Helm chart does the
      # same, and pairs it with a dedicated migrations Job that owns migrations.
      #
      # Why this stack must NOT set it true on first boot: a fresh Podman deploy
      # starts against a brand-new EMPTY named volume, and there is no migrations
      # Job here. With DISABLE_SCHEMA_UPDATE=true the proxy replaces its
      # `prisma migrate deploy` run with a read-only `prisma migrate diff` that
      # PRINTS the required SQL and executes none of it. No LiteLLM table is ever
      # created, /health/readiness never reports the DB connected, and you get an
      # endlessly unhealthy container with a non-obvious cause.
      #
      # Steady state: this single-container topology has exactly one process that
      # could ever migrate, so letting it migrate on every start is safe and is
      # LiteLLM's documented default. Leave this at false unless you have added
      # your own separate migration step - see .env.example.
      DISABLE_SCHEMA_UPDATE: "${DISABLE_SCHEMA_UPDATE:-false}"

    # THE INIT-CONTAINER REPLACEMENT, AND AN IMPROVEMENT OVER k3s.
    # k3s uses an initContainer (busybox:1.36) that polls `nc -z
    # litellm-postgres 5432`. That goes green as soon as the TCP listener binds -
    # and PostgreSQL binds its socket DURING initdb, before it will accept
    # authenticated connections, so the proxy can still lose the race on a cold
    # volume. Gating on the pg_isready healthcheck instead is application-level
    # readiness, and it removes the busybox image from the dependency set
    # entirely (one fewer image to pull, pin and patch).
    #
    # Requires Podman >= 4.6 (`podman wait --condition=healthy`) and a
    # podman-compose new enough to enforce conditions. If your proxy still starts
    # before Postgres is ready, see README Troubleshooting.
    depends_on:
      postgres:
        condition: service_healthy

    # Single healthcheck again: k3s runs readiness on /health/readiness (DB-aware)
    # and liveness on /health/liveliness (process-only, does not touch the DB).
    # /health/liveliness is chosen here because nothing downstream depends on
    # this container's health - there is no load balancer for a readiness result
    # to influence - and because a DB-aware check would deadlock any future
    # health-gated start. Poll /health/readiness yourself for a real smoke test:
    #     curl -s localhost:4000/health/readiness
    #
    # Timings mirror the k3s livenessProbe (period 20s, timeout 10s,
    # failureThreshold 6, initialDelaySeconds 120). start_period is actually
    # better than initialDelaySeconds: failures inside it do not count toward
    # `retries`, but a success inside it marks the container healthy immediately,
    # so a fast boot is not artificially delayed by two minutes.
    #
    # python -c, NOT curl: the LiteLLM image ships Python but does NOT ship curl.
    # A curl-based healthcheck fails permanently with "executable not found".
    # Match on the HTTP status code, never on the response body.
    #
    # NOTE: /health (no suffix) is a completely different endpoint - it requires
    # a valid key and runs a real test request against EVERY configured model,
    # so using it as a healthcheck would burn OpenRouter credits on every probe.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 120s

    # k3s limits were cpu "2" / memory 2Gi; requests are dropped as above.
    # Upstream documents 4Gi as a per-worker floor rather than a target, because
    # Prisma's query engine runs as a separate process whose resident memory
    # behaves as a high-water mark. 2g is kept here for exact parity with the
    # k3s deployment - raise it if you see OOM kills in `podman events`.
    mem_limit: 2g
    cpus: 2.0

    labels:
      app: "litellm"
      app.kubernetes.io/name: "litellm"
      app.kubernetes.io/part-of: "woow-litellm"

# =============================================================================
# Named bridge network.
#
# This is NOT optional and must NOT be replaced by Podman's built-in `podman`
# network: the default network is memory-only and performs NO DNS resolution
# (a deliberate Docker-compatibility decision), so litellm would be unable to
# resolve `litellm-postgres` at all. A user-defined bridge network gets
# netavark + aardvark-dns, which resolve container names and network aliases.
#
# Declaring it explicitly (rather than relying on the implicit default project
# network) also makes this file behave identically under podman-compose,
# `podman compose` and Portainer.
# =============================================================================
networks:
  litellm-network:
    driver: bridge

# =============================================================================
# Named volume for the Postgres data directory.
#
# k3s analogue: the 5Gi ReadWriteOnce local-path volumeClaimTemplate. Neither
# the size nor the access mode survives translation - a Podman named volume is
# an unbounded host directory with no interlock preventing two containers from
# mounting it simultaneously (which WOULD corrupt the cluster). Do not run the
# compose path and the Quadlet path against the same data at the same time; the
# Quadlet path deliberately uses a differently-named volume.
#
# LIFECYCLE WARNING:
#   podman-compose down       -> containers removed, DATA PRESERVED
#   podman-compose down -v    -> DATA DESTROYED, including every virtual key,
#                                spend record and encrypted provider credential
#                                that LITELLM_SALT_KEY protects.
# Take a pg_dump first - see README "Useful Commands".
# =============================================================================
volumes:
  pgdata:
    driver: local
    labels:
      app: "litellm-postgres"
      app.kubernetes.io/part-of: "woow-litellm"

# =============================================================================
# DELIBERATELY ABSENT: cloudflared
#
# The k3s stack includes k8s/05-cloudflared.yaml, a connector that fronts the
# existing k3s deployment using a Cloudflare tunnel token stored in a cluster
# Secret. This package ships NO cloudflared service, no TUNNEL_TOKEN variable
# and no tunnel unit, on purpose.
#
#   !! NEVER paste the k3s tunnel token into this stack. !!
#
# A second connector registered with the SAME token becomes an additional
# endpoint for that SAME tunnel, and Cloudflare will load-balance inbound
# requests across both connectors - sending an unpredictable fraction of live
# production traffic to this stack's Postgres and key store. That would split
# traffic non-deterministically and could break the existing k3s deployment.
#
# If you need external access, choose one and terminate it yourself:
#   - a reverse proxy (Caddy / nginx / Traefik) with its own TLS certificate,
#   - a Tailscale or WireGuard overlay (no public exposure at all), or
#   - a deliberate, firewalled port publish.
# If you specifically want a Cloudflare tunnel, create a NEW tunnel with a NEW
# hostname and a NEW token. See README "Other deployment platforms".
# =============================================================================
