# =============================================================================
# WOOWTECH / Woow_podman_litellm - static checks
# =============================================================================
# This workflow is deliberately STATIC ONLY. It never installs Podman, never
# pulls an image and never starts a container, because a green run here must not
# be mistaken for "the stack was verified working". The only thing that can make
# that claim is scripts/smoke-test.sh, run by a human against a real host.
#
# What it does check, and why each one has bitten this kind of repo before:
#   1. shell syntax + shellcheck  - install.sh/restore.sh are destructive;
#                                   a typo there deletes a volume.
#   2. YAML parses                - a broken docker-compose.yml or config.yaml
#                                   only surfaces at `up` time otherwise.
#   3. config.yaml drift          - this file must stay byte-identical to the
#                                   k3s deployment's copy.
#   4. Quadlet unit sanity        - every unit needs its type-specific section.
#   5. credential-shaped strings  - a real key must never reach this repo.
#   6. no committed .env          - only the *.example templates are tracked.
# =============================================================================

name: lint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Shell scripts
      # -----------------------------------------------------------------------
      - name: bash -n (parse every shell script)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          exit "$fail"

      - name: shellcheck
        run: |
          set -euo pipefail
          # Preinstalled on ubuntu-latest runners.
          shellcheck --version
          # SC2181/SC2016 are style preferences this repo intentionally ignores:
          # SC2016 fires on the single-quoted podman-run wait loop, which MUST
          # stay unexpanded so the remote shell sees the $i loop variable.
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning --exclude=SC2016,SC2181

      - name: scripts are executable
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if [ ! -x "$f" ]; then
              echo "FAIL not executable (git mode should be 100755): $f"
              fail=1
            fi
          done < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          exit "$fail"

      # -----------------------------------------------------------------------
      # 2. YAML
      # -----------------------------------------------------------------------
      - name: YAML parses and compose has the expected shape
        run: |
          python3 - <<'PY'
          import sys, yaml

          errors = []

          compose = yaml.safe_load(open("docker-compose.yml"))
          services = compose.get("services", {})
          for name in ("postgres", "litellm"):
              if name not in services:
                  errors.append(f"docker-compose.yml: missing service {name!r}")

          # House style: every service is named, restarts, and is health-checked.
          for name, svc in services.items():
              for key in ("container_name", "restart", "healthcheck"):
                  if not svc.get(key):
                      errors.append(f"docker-compose.yml: service {name!r} has no {key!r}")

          # The proxy must not start before the database is healthy.
          dep = services.get("litellm", {}).get("depends_on", {})
          if dep.get("postgres", {}).get("condition") != "service_healthy":
              errors.append("docker-compose.yml: litellm must depend_on postgres "
                            "with condition: service_healthy")

          cfg = yaml.safe_load(open("config/config.yaml"))
          if not cfg.get("model_list"):
              errors.append("config/config.yaml: model_list is empty or missing")

          for e in errors:
              print("FAIL", e)
          sys.exit(1 if errors else 0)
          PY

      # -----------------------------------------------------------------------
      # 3. config.yaml must not drift from the k3s deployment
      # -----------------------------------------------------------------------
      # config/config.yaml is SHARED with the k3s stack. Both deployments must
      # serve the same models, so this file is copied verbatim and pinned here.
      # If you intentionally change the model list, update this hash in the same
      # commit and mirror the change into the k3s repo.
      - name: config/config.yaml hash is pinned
        run: |
          set -euo pipefail
          expected=4876702dde54e214d71fd6724a303c3f9c70fec6
          actual=$(git hash-object config/config.yaml)
          echo "expected $expected"
          echo "actual   $actual"
          [ "$actual" = "$expected" ] || {
            echo "FAIL config/config.yaml drifted from the pinned k3s copy."
            exit 1
          }

      # -----------------------------------------------------------------------
      # 4. Quadlet units
      # -----------------------------------------------------------------------
      - name: Quadlet units have their required sections
        run: |
          set -euo pipefail
          fail=0
          check() {   # check <file> <section>
            if grep -qE "^\[$2\]" "$1"; then
              echo "ok   $1 has [$2]"
            else
              echo "FAIL $1 is missing [$2]"
              fail=1
            fi
          }
          for f in quadlet/*.container; do check "$f" Container; done
          for f in quadlet/*.volume;    do check "$f" Volume;    done
          for f in quadlet/*.network;   do check "$f" Network;   done
          for f in quadlet/*.service;   do check "$f" Service;   done

          # A .container without [Install] never starts at boot, which is the
          # entire reason path B exists.
          for f in quadlet/*.container; do check "$f" Install; done
          exit "$fail"

      - name: no cloudflared anywhere
        run: |
          set -euo pipefail
          # The production tunnel token belongs to the existing k3s deployment.
          # A second connector sharing it would split live traffic, so this
          # package must never ship a cloudflared container or service.
          # --exclude-dir=.github, or this very rule matches its own pattern.
          if grep -rniE 'image:[[:space:]]*.*cloudflared|^Image=.*cloudflared' \
               --exclude-dir=.github \
               --include='*.yml' --include='*.yaml' --include='*.container' .; then
            echo "FAIL a cloudflared container was added - see docs/k3s-to-podman.md"
            exit 1
          fi
          echo "ok   no cloudflared container defined"

      # -----------------------------------------------------------------------
      # 5. Credentials
      # -----------------------------------------------------------------------
      - name: no credential-shaped strings
        run: |
          set -euo pipefail
          # Value-shaped, not name-shaped: the docs legitimately discuss these
          # variable NAMES, so only things shaped like a real secret fail here.
          # -P (PCRE) is required for the negative lookahead that lets the
          # documented placeholder passwords through.
          patterns='sk-or-v[0-9]+-[0-9a-zA-Z]{24,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]{0,20}PRIVATE KEY-----|postgres(?:ql)?://[^:\s]+:(?!CHANGE_ME|YOUR_|REPLACE|<)[^@\s]{12,}@'
          if grep -rnIP "$patterns" --exclude-dir=.git .; then
            echo "FAIL something credential-shaped is committed"
            exit 1
          fi
          echo "ok   no credential-shaped strings found"

      - name: only *.example env files are tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env' | grep -vE '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "FAIL a real env file is tracked:"
            echo "$bad"
            exit 1
          fi
          echo "ok   only .env.example / .env.quadlet.example are tracked"

      # -----------------------------------------------------------------------
      # 6. Docs
      # -----------------------------------------------------------------------
      - name: every required file is present
        run: |
          set -euo pipefail
          fail=0
          for f in \
            README.md README_zh-TW.md DEPLOYMENT.md DEPLOYMENT_zh-TW.md SKILL.md \
            LICENSE .gitignore .env.example .env.quadlet.example docker-compose.yml \
            config/config.yaml docs/architecture.md docs/k3s-to-podman.md \
            quadlet/litellm.network quadlet/litellm-pgdata.volume \
            quadlet/litellm-postgres.container quadlet/litellm.container \
            quadlet/litellm-wait-postgres.service quadlet/install.sh quadlet/uninstall.sh \
            scripts/smoke-test.sh scripts/backup.sh scripts/restore.sh
          do
            if [ -s "$f" ]; then
              echo "ok   $f"
            else
              echo "FAIL missing or empty: $f"
              fail=1
            fi
          done
          exit "$fail"
