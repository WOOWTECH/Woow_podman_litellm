# Aligned with woow-paas-charts charts/litellm 0.3.16 at cbe71358.
# Models, provider credentials and budgets belong in the database and Admin UI.
model_list: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  maximum_spend_logs_retention_period: "90d"
  maximum_spend_logs_retention_interval: "1d"
  database_connection_pool_limit: 10
  proxy_batch_write_at: 60
  trusted_proxy_ranges: ["127.0.0.1/32"]
litellm_settings:
  drop_params: true
  request_timeout: 90
  budget_exceeded_status_code: 429
  sse_keepalive_ping_interval_seconds: 15
router_settings:
  num_retries: 0
